<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a">

    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <!--[if lt IE 9]>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->
    {% include head-custom.html %}
  </head>
  <body>
    <div class="wrapper">
      <header class="site-header">
        <p class="site-kicker">Portfolio</p>
        <h1><a href="{{ '/' | absolute_url }}">{{ site.title | default: site.github.repository_name }}</a></h1>

        {% if site.logo %}
          <img class="profile-image" src="{{ site.logo | relative_url }}" alt="Profile photo of {{ site.title | default: site.github.owner_name }}">
        {% endif %}

        <p class="site-description">{{ site.description | default: site.github.project_tagline }}</p>

        <nav class="social-links" aria-label="Professional profiles">
          <a href="https://github.com/mdnizamjaafar">GitHub profile</a>
          <a href="https://www.linkedin.com/in/mdnizamjaafar/">LinkedIn</a>
        </nav>
      </header>

      <main class="page-content">
        {{ content }}
      </main>

      <footer class="site-footer">
        <p>Thank you for visiting my portfolio.</p>
      </footer>
    </div>
    <script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>
  </body>
</html>
